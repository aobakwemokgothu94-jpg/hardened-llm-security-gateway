name: Build and Deploy Hardened LLM Gateway

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 1. 🛡️ Shift-Left Supply Chain Security Checks
    - name: Set up Syft CLI
      run: curl -sSfL https://githubusercontent.com | sh -s -- -b /usr/local/bin

    - name: Set up Grype CLI
      run: curl -sSfL https://githubusercontent.com | sh -s -- -b /usr/local/bin

    - name: Generate CycloneDX SBOM
      run: syft dir:. --output cyclonedx-json=sbom.json

    - name: Scan Dependencies for Vulnerabilities
      run: grype sbom:sbom.json --fail-on high

    # 2. ☁️ Authenticate & Deploy to Azure
    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Build and Push Image to Azure Container Registry (ACR)
      run: |
        az acr build --registry ${{ secrets.AZURE_REGISTRY_NAME }} --image hardened-llm-gateway:${{ github.sha }} .

    - name: Deploy to Azure Container Apps (ACA)
      run: |
        az containerapp update \
          --name hardened-llm-gateway \
          --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
          --image ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io/hardened-llm-gateway:${{ github.sha }} \
          --cpu 0.25 --memory 0.5Gi \
          --min-replicas 0 --max-replicas 2
